name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT, deliberately not GITHUB_TOKEN, and this is load-bearing.
          # Pull requests opened with GITHUB_TOKEN do not trigger any workflow, so
          # the release PR used to appear with zero checks; with required status
          # checks and enforce_admins that leaves it permanently unmergeable and
          # stalls the release with no failing check to explain it. A PAT opens
          # the PR as a user, so the checks run and the exemption in pr-check.yml
          # applies. It also lets the repository keep "Allow GitHub Actions to
          # create and approve pull requests" disabled.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node

      # Merge the release pull request once its required checks pass, so cutting
      # a release no longer needs a manual merge. The repository has auto-merge
      # enabled. This depends on the release PR being exempt from the PR
      # validation checks: pr-check.yml skips any branch starting with
      # `release-please--`, which is this one. If that exemption ever breaks,
      # auto-merge silently stops firing and releases stall without a red check.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh pr merge --auto --merge \
            --repo "${{ github.repository }}" \
            "${{ fromJSON(steps.release.outputs.pr).number }}"

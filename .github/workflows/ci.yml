name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `tsc -b`, deliberately not `tsc --noEmit`. With the solution-style
      # tsconfig.json (`files: []` plus references), `tsc --noEmit` compiles zero
      # files and always exits 0, so this step used to be a check that certified
      # nothing: `npm run build` was broken while this job stayed green. `-b`
      # follows the project references and is the check that actually runs.
      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint .

      - name: Test
        run: npm test
